
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Project</title>
    <link rel="stylesheet" href="miniproject.css" />
    <!-- Correct Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    
    <div class="main_box">
        <!-- Hidden Checkbox -->
        <input type="checkbox" id="check" />

        <!-- Hamburger Button -->
        <div class="btn_one">
            <label for="check">
                <i class="fa-solid fa-bars"></i>
            </label>
        </div>

        <!-- Sidebar -->
        <div class="sidebar_menu">
            <div class="logo">
                <a href="#">Camera</a>
            </div>

            <!-- Close Button -->
            <div class="btn_two">
                <label for="check">
                    <i class="fa-solid fa-xmark"></i>
                </label>
            </div>

            <!-- Menu List -->
            <div class="menu">
                <ul>
                    <li><i class="fa-solid fa-image"></i><a href="#">Gallery</a></li>
                    <li><i class="fa-solid fa-share-from-square"></i><a href="#">Shortcuts</a></li>
                    <li><i class="fa-solid fa-calendar-days"></i><a href="#">Exhibits</a></li>
                    <li><i class="fa-solid fa-shop"></i><a href="#">Store</a></li>
                    <li><i class="fa-solid fa-phone"></i><a href="#">Contact</a></li>
                    <li><i class="fa-solid fa-comments"></i><a href="#">Feedback</a></li>
                </ul>
            </div>

            <!-- Social Media Icons -->
            <div class="social_media">
                <ul>
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                    <a href="#"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </ul>
            </div>
        </div>
    </div>
    
</body>
</html>
